<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimplyBudget</title>
    <style>
        /* Base styles */
        body { background: #0b0c16; color: #f3f4f6; font-family: sans-serif; margin: 0; }
        .auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f1123; z-index: 9999; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .auth-card { background: rgba(255,255,255,0.05); padding: 40px; border-radius: 24px; text-align: center; width: 100%; max-width: 400px; border: 1px solid rgba(255,255,255,0.1); }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: white; box-sizing: border-box; }
        button { background: #3b82f6; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: 600; }
        #appContent { display: none; }
    </style>
</head>
<body>

<div id="authScreen" class="auth-overlay">
    <div class="auth-card">
        <h2>SimplyBudget Login</h2>
        <input type="text" id="loginP1" placeholder="Your Name">
        <input type="text" id="loginP2" placeholder="Partner Name">
        <button onclick="saveNames()">Start Budgeting</button>
    </div>
</div>

<div id="welcomeScreen" class="auth-overlay" style="display:none;">
    <div class="auth-card">
        <h1>Welcome!</h1>
        <p>You're ready to master your joint finances.</p>
        <button onclick="goToTutorial()">Take the Tour</button>
    </div>
</div>

<div id="tutorialScreen" class="auth-overlay" style="display:none;">
    <div class="auth-card">
        <h2>Quick Tour</h2>
        <p style="text-align: left;">1. Add your income.<br>2. Log your monthly bills.<br>3. Tap "Pending" to mark as Paid.</p>
        <button onclick="startApp()">Let's Go!</button>
    </div>
</div>

<div id="appContent">
    <h1 style="text-align: center;">SimplyBudget Dashboard</h1>
    <p style="text-align: center;">Your budget data is active!</p>
    </div>

<script>
    // Load state
    let state = JSON.parse(localStorage.getItem('budgetAppFlow')) || { step: 'login' };

    function render() {
        document.getElementById('authScreen').style.display = state.step === 'login' ? 'flex' : 'none';
        document.getElementById('welcomeScreen').style.display = state.step === 'welcome' ? 'flex' : 'none';
        document.getElementById('tutorialScreen').style.display = state.step === 'tutorial' ? 'flex' : 'none';
        document.getElementById('appContent').style.display = state.step === 'dashboard' ? 'block' : 'none';
    }

    function saveNames() {
        const p1 = document.getElementById('loginP1').value;
        const p2 = document.getElementById('loginP2').value;
        if(p1 && p2) {
            localStorage.setItem('budgetNamesConfig', JSON.stringify({p1, p2}));
            state.step = 'welcome';
            updateState();
        }
    }

    function goToTutorial() { state.step = 'tutorial'; updateState(); }
    function startApp() { state.step = 'dashboard'; updateState(); }

    function updateState() {
        localStorage.setItem('budgetAppFlow', JSON.stringify(state));
        render();
    }

    render();
</script>
</body>
</html>
